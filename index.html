<html>

<head>
  <link rel="stylesheet" href="style.css">
  <title>
    Foodie
  </title>
</head>

<body>
  <h1 class="logo">
    FOODIE
  </h1>
  <div class="restaurants">
    <div class="rest restaurant-1">
      <img src="assets/miss_nora.jpeg" class="r-img">
      <div class="layer-1">
        <h5 class="r-name">
          Miss Nora
        </h5>
        <div class="rating">
          <h6 class="rated rated-1">4.1</h6>
        </div>
      </div>
      <h6 class="address">Noida</h6>
      <h6 class="timings">10am-11pm</h6>
      <h6 class="cost">1500/person</h6>
    </div>
    <div class="rest restaurant-2">
      <img src="assets/pf_chang.jpeg" class="r-img">
      <div class="layer-1">
        <h5 class="r-name">
          P.F. Chang's
        </h5>
        <div class="rating">
          <h6 class="rated rated-2">4.6</h6>
        </div>
      </div>
      <h6 class="address">Noida</h6>
      <h6 class="timings">11am-6pm</h6>
      <h6 class="cost">1200/person</h6>
    </div>
    <div class="rest restaurant-3">
      <img src="assets/zuki.jpeg" class="r-img">
      <div class="layer-1">
        <h5 class="r-name">
          Zuki
        </h5>
        <div class="rating">
          <h6 class="rated rated-3">4.9</h6>
        </div>
      </div>
      <h6 class="address">Noida</h6>
      <h6 class="timings">9am-9pm</h6>
      <h6 class="cost">4000/person</h6>
    </div>
    <div class="rest restaurant-4">
      <img src="assets/sticky_rice.jpeg" class="r-img">
      <div class="layer-1">
        <h5 class="r-name">
          Sticky Rice
        </h5>
        <div class="rating">
          <h6 class="rated rated-4">4.3</h6>
        </div>
      </div>
      <h6 class="address">Noida</h6>
      <h6 class="timings">12pm-2am</h6>
      <h6 class="cost">1600/person</h6>
    </div>
  </div>
</body>

</html>
