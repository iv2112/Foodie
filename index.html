<html>

<head>
  <link rel="stylesheet" href="style.css">
  <title>
    Foodie
  </title>
</head>

<body>
  <svg class="svg-defs" aria-hidden="true">
    <defs>
      <linearGradient id="half-star">
        <stop offset="50%" stop-color="#f5b301"></stop>
        <stop offset="50%" stop-color="transparent"></stop>
      </linearGradient>
      <symbol id="star-half" viewBox="0 0 24 24">
        <path class="star-path"
          d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
      </symbol>
    </defs>
  </svg>
  <a href="index.html" class="logo">
    FOODIE
  </a>
  <div class="restaurants">
    <a href="miss_nora.html" class="rest restaurant-1">
      <img src="assets/miss_nora.jpeg" class="r-img">
      <div class="layer-1">
        <h5 class="r-name">
          Miss Nora
        </h5>
        <div class="rating">
          <h6 class="rated rated-1">4.1</h6>
          <svg class="star star-1" viewBox="0 0 24 24">
            <use href="#star-half"></use>
          </svg>
        </div>
      </div>
      <div class="more-info">
        <h6 class="address">Noida</h6>
        <span class="dot">•</span>
        <h6 class="timings">10am-12am</h6>
        <span class="dot">•</span>
        <h6 class="cost">$1500/Person</h6>
      </div>
    </a>
    <a href="pf_chang.html" class="rest restaurant-2">
      <img src="assets/pf_chang.jpeg" class="r-img">
      <div class="layer-1">
        <h5 class="r-name">
          P.F. Chang's
        </h5>
        <div class="rating">
          <h6 class="rated rated-2">4.6</h6>
          <svg class="star star-2" viewBox="0 0 24 24">
            <use href="#star-half"></use>
          </svg>
        </div>
      </div>
      <div class="more-info">
        <h6 class="address">Delhi</h6>
        <span class="dot">•</span>
        <h6 class="timings">11am-6pm</h6>
        <span class="dot">•</span>
        <h6 class="cost">$1200/Person</h6>
      </div>
    </a>
    <a href="zuki.html" class="rest restaurant-3">
      <img src="assets/zuki.jpeg" class="r-img">
      <div class="layer-1">
        <h5 class="r-name zuki">
          Zuki
        </h5>
        <div class="rating">
          <h6 class="rated rated-3">4.9</h6>
          <svg class="star star-3" viewBox="0 0 24 24">
            <use href="#star-half"></use>
          </svg>
        </div>
      </div>
      <div class="more-info">
        <h6 class="address">Tokyo</h6>
        <span class="dot">•</span>
        <h6 class="timings">9am-9pm</h6>
        <span class="dot">•</span>
        <h6 class="cost">$4000/Person</h6>
      </div>
    </a>
    <a href="sticky_rice.html" class="rest restaurant-4">
      <img src="assets/sticky_rice.jpeg" class="r-img">
      <div class="layer-1">
        <h5 class="r-name">
          Sticky Rice
        </h5>
        <div class="rating">
          <h6 class="rated rated-4">4.3</h6>
          <svg class="star star-4" viewBox="0 0 24 24">
            <use href="#star-half"></use>
          </svg>
        </div>
      </div>
      <div class="more-info">
        <h6 class="address">Noida</h6>
        <span class="dot">•</span>
        <h6 class="timings">12pm-6pm</h6>
        <span class="dot">•</span>
        <h6 class="cost">$1600/Person</h6>
      </div>
    </a>
  </div>
  <h2 class="about">
    About Us
  </h2>
</body>

</html>
